name: release

# Publishes to PyPI via trusted publishing (OIDC) — no stored token. The PyPI project must list
# this repo (Nuraveda/linkedin-ads-mcp), workflow `release.yml`, as a trusted publisher.
# Fires on a v* tag or manual dispatch.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Re-runs / partial uploads won't fail the job on already-present files.
          skip-existing: true
